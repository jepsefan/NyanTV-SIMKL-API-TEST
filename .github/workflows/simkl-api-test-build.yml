name: Simkl Beta - Build Debug APK
on:
  push:
    branches:
      - beta/simkl-latest-unwatched
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install required SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        run: |
          if [ -z "$SIMKL_CLIENT_ID" ]; then
            echo "Missing SIMKL_CLIENT_ID in GitHub Actions Secrets"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace \
            -PSIMKL_CLIENT_ID="$SIMKL_CLIENT_ID" \
            -PSIMKL_CLIENT_SECRET="$SIMKL_CLIENT_SECRET"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NyanTV-Simkl-Latest-Unwatched-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
