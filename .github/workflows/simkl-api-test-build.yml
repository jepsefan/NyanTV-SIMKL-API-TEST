name: Simkl API test debug APK
on:
  push:
    branches:
      - beta/simkl-latest-unwatched
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3
      - name: Install required SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build unsigned-for-release debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NyanTV-Simkl-Latest-Unwatched-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
